name: Lint and tests
on: [ push, pull_request ]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest
